about:
  eyebrow: ABOUT / A LITTLE ABOUT ME
  title: Hi, I'm Ning ;)
  intro: >-
    Curious about people, stories, and the why behind behaviors.

    Interested in qualitative research, with experience in academic research and insight exploration.
  intro_zh: 保持好奇:)
  paragraphs:
    - |-
      我的日常在交流、阅读、影视、音乐与研究之间展开。
      它们看起来属于不同的领域，却常常把我带回相似的问题：人如何理解自己，又如何在具体的社会环境中生活？
      这里便是我保存这些探索的地方，
      在某种程度上来说，这是我的一部分。
