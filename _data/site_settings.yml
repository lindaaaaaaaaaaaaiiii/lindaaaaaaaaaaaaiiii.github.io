about:
  eyebrow: ABOUT / A LITTLE ABOUT ME
  title: Hi, I'm Ning ;)
  intro: >-
    Curious about people, stories, and the why behind behaviors.

    Interested in qualitative research, with experience in academic research and insight exploration.
  intro_zh: >-
    Curious about people, stories, and the why behind behaviors.

    Interested in qualitative research, with experience in academic research and insight exploration.
  photo: /assets/uploads/wechatimg322.jpg
  paragraphs:
    - 我的日常在交流、写字、阅读、电影、音乐与研究之间展开。它们看起来属于不同的领域，却常常把我带回相似的问题：人如何理解自己，又如何在具体的社会环境中生活？我喜欢从真实的人和经验出发，慢慢接近一个问题。
    - 我也对不同领域的研究与专业探索保持兴趣。无论是社会议题、消费者行为，还是学术研究中的复杂问题，我都享受从提问开始，搜集材料、连接线索、检验想法的过程。这个网站便是我保存这些探索的地方：有阅读与观影记录、社会观察、研究与实践，也有一些尚未完全成形的想法。
