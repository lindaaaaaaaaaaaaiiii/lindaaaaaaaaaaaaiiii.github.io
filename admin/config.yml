backend:
  name: turbo-github
  turbo_site_id: "a9670411-9d85-4686-8e8f-bcfc6b4149ae"
  branch: main

site_url: https://lindaaaaaaaaaaaaiiii.github.io
display_url: https://lindaaaaaaaaaaaaiiii.github.io

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "zh_Hans"
publish_mode: simple

collections:
  - name: "site_settings"
    label: "网站设置"
    files:
      - name: "homepage_and_about"
        label: "首页与个人介绍"
        file: "_data/site_settings.yml"
        fields:
          - label: "首页设置"
            name: "homepage"
            widget: "object"
            fields:
              - label: "首页大幅背景图片"
                name: "hero_background"
                widget: "image"
                hint: "上传或选择首页首屏背景图片。"
              - label: "背景图片说明文字"
                name: "hero_background_alt"
                widget: "string"
                required: false
              - label: "首页顶部左侧英文"
                name: "hero_topline_left"
                widget: "string"
              - label: "首页顶部右侧英文"
                name: "hero_topline_right"
                widget: "string"
              - label: "最新更新栏目标题"
                name: "latest_label"
                widget: "string"
              - label: "显示每月文章轮播"
                name: "show_monthly_updates"
                widget: "boolean"
                default: true
              - label: "每月文章区域英文眉题"
                name: "monthly_eyebrow"
                widget: "string"
              - label: "每月文章区域标题"
                name: "monthly_title"
                widget: "string"
              - label: "每月文章区域说明"
                name: "monthly_description"
                widget: "text"
              - label: "更多文章按钮中文"
                name: "monthly_more_label"
                widget: "string"
              - label: "更多文章按钮英文"
                name: "monthly_more_en"
                widget: "string"
              - label: "显示首页底部栏目入口"
                name: "show_home_links"
                widget: "boolean"
                default: true
              - label: "创作栏目标题"
                name: "creation_title"
                widget: "string"
              - label: "创作栏目英文"
                name: "creation_english"
                widget: "string"
              - label: "创作栏目说明"
                name: "creation_description"
                widget: "string"
              - label: "研究与实践栏目标题"
                name: "research_title"
                widget: "string"
              - label: "研究与实践栏目英文"
                name: "research_english"
                widget: "string"
              - label: "研究与实践栏目说明"
                name: "research_description"
                widget: "string"
              - label: "文章归档栏目标题"
                name: "archive_title"
                widget: "string"
              - label: "文章归档栏目英文"
                name: "archive_english"
                widget: "string"
              - label: "文章归档栏目说明"
                name: "archive_description"
                widget: "string"
          - label: "我是谁页面"
            name: "about"
            widget: "object"
            fields:
              - label: "英文眉题"
                name: "eyebrow"
                widget: "string"
              - label: "页面标题"
                name: "title"
                widget: "string"
              - label: "标题下方简介"
                name: "intro"
                widget: "text"
              - label: "个人介绍段落"
                name: "paragraphs"
                widget: "list"
                field:
                  label: "段落内容"
                  name: "paragraph"
                  widget: "text"
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}/"
    sortable_fields: ["date", "title"]
    summary: "{{year}}-{{month}}-{{day}} · {{category_group}} · {{title}}"
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "副标题"
        name: "subtitle"
        widget: "string"
        required: false
      - label: "发布时间"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
      - label: "一级分类"
        name: "category_group"
        widget: "select"
        options:
          - "创作"
          - "研究与实践"
      - label: "具体栏目"
        name: "subcategory"
        widget: "select"
        options:
          - "影视阅读"
          - "社会观察"
          - "社会学研究"
          - "政策与公共议题研究"
          - "市场研究"
      - label: "文章摘要"
        name: "description"
        widget: "text"
        required: false
      - label: "封面图片"
        name: "cover"
        widget: "image"
        required: false
        default: "/assets/images/default-cover.svg"
      - label: "阅读背景主题色（可选）"
        name: "theme_color"
        widget: "string"
        required: false
        hint: "留空时自动提取封面图片主色；如需手动覆盖，请填写 HEX 色值，例如 #26342E。"
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "正文"
        name: "body"
        widget: "markdown"
