backend:
  name: turbo-github
  turbo_site_id: "a9670411-9d85-4686-8e8f-bcfc6b4149ae"
  branch: main

site_url: https://lindaaaaaaaaaaaaiiii.github.io
display_url: https://lindaaaaaaaaaaaaiiii.github.io

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "zh_Hans"
publish_mode: simple

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}/"
    sortable_fields: ["date", "title"]
    summary: "{{year}}-{{month}}-{{day}} · {{category_group}} · {{title}}"
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "副标题"
        name: "subtitle"
        widget: "string"
        required: false
      - label: "发布时间"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
      - label: "一级分类"
        name: "category_group"
        widget: "select"
        options:
          - "创作"
          - "研究与实践"
      - label: "具体栏目"
        name: "subcategory"
        widget: "select"
        options:
          - "影视阅读"
          - "社会观察"
          - "社会学研究"
          - "政策与公共议题研究"
          - "市场研究"
      - label: "文章摘要"
        name: "description"
        widget: "text"
        required: false
      - label: "封面图片"
        name: "cover"
        widget: "image"
        required: false
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "正文"
        name: "body"
        widget: "markdown"
