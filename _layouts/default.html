<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}">FIELD NOTES<span>Ning's field observation</span></a>
  <nav aria-label="主导航">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/content/' | relative_url }}">创作</a>
    <a href="{{ '/research/' | relative_url }}">研究与实践</a>
    <a href="{{ '/archive/' | relative_url }}">归档</a>
    <a href="{{ '/about/' | relative_url }}">关于</a>
  </nav>
</header>
<main class="site-main">{{ content }}</main>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} · FIELD NOTES</span><span>持续观察，持续书写。</span></footer>
</body>
</html>
