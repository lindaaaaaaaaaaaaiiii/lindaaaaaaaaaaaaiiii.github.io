<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body class="{% if page.layout == 'post' %}post-page{% elsif page.url == '/' %}home-page{% endif %}" data-theme-color="{{ page.theme_color | default: '' | escape }}">
<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}">FIELD NOTES<span>Ning's field observation</span></a>
  <nav aria-label="主导航">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/about/' | relative_url }}">我是谁</a>
  </nav>
</header>
{% if page.layout == 'post' %}
<div class="reading-progress" aria-hidden="true"><span class="reading-progress__bar"></span></div>
{% endif %}
<main class="site-main">{{ content }}</main>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} · FIELD NOTES</span><span>持续观察，持续书写。</span></footer>
<script>
(function () {
  var body = document.body;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Homepage: subtle cinematic parallax on the river-valley hero */
  if (body.classList.contains('home-page')) {
    var homeHero = document.querySelector('.home-hero-single');
    var heroImage = homeHero && homeHero.querySelector('.hero-single-image');
    if (homeHero && heroImage && !reduceMotion) {
      var parallaxTicking = false;
      function updateHeroParallax() {
        var rect = homeHero.getBoundingClientRect();
        var shift = Math.max(-55, Math.min(105, -rect.top * 0.16));
        heroImage.style.transform = 'translate3d(0,' + shift.toFixed(1) + 'px,0) scale(1.12)';
        parallaxTicking = false;
      }
      window.addEventListener('scroll', function () {
        if (!parallaxTicking) {
          window.requestAnimationFrame(updateHeroParallax);
          parallaxTicking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', updateHeroParallax);
      updateHeroParallax();
    }

    /* Each month has its own horizontal article carousel */
    document.querySelectorAll('[data-month-carousel]').forEach(function (carousel) {
      var track = carousel.querySelector('[data-carousel-track]');
      var section = carousel.closest('.month-block');
      var previous = section && section.querySelector('[data-carousel-prev]');
      var next = section && section.querySelector('[data-carousel-next]');
      if (!track || !previous || !next) return;

      function updateControls() {
        var maxScroll = track.scrollWidth - track.clientWidth;
        previous.disabled = track.scrollLeft <= 2;
        next.disabled = maxScroll <= 2 || track.scrollLeft >= maxScroll - 2;
      }
      previous.addEventListener('click', function () {
        track.scrollBy({ left: -Math.max(280, track.clientWidth * 0.72), behavior: reduceMotion ? 'auto' : 'smooth' });
      });
      next.addEventListener('click', function () {
        track.scrollBy({ left: Math.max(280, track.clientWidth * 0.72), behavior: reduceMotion ? 'auto' : 'smooth' });
      });
      track.addEventListener('scroll', updateControls, { passive: true });
      window.addEventListener('resize', updateControls);
      updateControls();
    });
  }

  if (!body.classList.contains('post-page')) return;

  /* Derive a restrained dark reading palette from the cover image's dominant hue */
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4; break;
      }
      h *= 60;
    }
    return { h: h, s: s, l: l };
  }

  function applyHue(hue, saturation) {
    var h = Math.round((hue + 360) % 360);
    var s = Math.max(14, Math.min(34, Math.round(saturation * 42)));
    var accentS = Math.max(34, Math.min(58, s + 16));
    body.style.setProperty('--article-bg', 'hsl(' + h + ' ' + s + '% 9%)');
    body.style.setProperty('--article-surface', 'hsl(' + h + ' ' + s + '% 13%)');
    body.style.setProperty('--article-line', 'hsl(' + h + ' ' + Math.min(24, s) + '% 25%)');
    body.style.setProperty('--article-accent', 'hsl(' + h + ' ' + accentS + '% 72%)');
    body.style.setProperty('--article-muted', 'hsl(' + h + ' 8% 68%)');
  }

  function applyHex(hex) {
    var match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!match) return false;
    var value = match[1];
    var rgb = {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
    var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    applyHue(hsl.h, Math.max(hsl.s, 0.25));
    return true;
  }

  function extractCoverPalette(image) {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      var context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(image, 0, 0, 64, 64);
      var pixels = context.getImageData(0, 0, 64, 64).data;
      var bins = [];
      for (var b = 0; b < 24; b++) bins.push({ weight: 0, hueX: 0, hueY: 0, saturation: 0, count: 0 });

      for (var i = 0; i < pixels.length; i += 16) {
        if (pixels[i + 3] < 150) continue;
        var color = rgbToHsl(pixels[i], pixels[i + 1], pixels[i + 2]);
        if (color.s < 0.13 || color.l < 0.09 || color.l > 0.92) continue;
        var bucket = Math.min(23, Math.floor(color.h / 15));
        var weight = color.s * (1 - Math.abs(color.l - 0.5) * 0.7);
        bins[bucket].weight += weight;
        bins[bucket].hueX += Math.cos(color.h * Math.PI / 180) * weight;
        bins[bucket].hueY += Math.sin(color.h * Math.PI / 180) * weight;
        bins[bucket].saturation += color.s * weight;
        bins[bucket].count++;
      }

      var dominant = bins.reduce(function (best, item) {
        return item.weight > best.weight ? item : best;
      }, { weight: 0, hueX: 0, hueY: 0, saturation: 0, count: 0 });

      if (!dominant.count || dominant.weight < 0.5) {
        applyHue(28, 0.25);
        return;
      }
      var hue = Math.atan2(dominant.hueY, dominant.hueX) * 180 / Math.PI;
      var saturation = dominant.saturation / dominant.weight;
      applyHue(hue, saturation);
    } catch (error) {
      /* Keep the neutral dark fallback if the image cannot be sampled. */
    }
  }

  var manualTheme = body.getAttribute('data-theme-color');
  var articleCover = document.querySelector('.article .cover');
  if (!applyHex(manualTheme) && articleCover) {
    if (articleCover.complete && articleCover.naturalWidth > 0) {
      extractCoverPalette(articleCover);
    } else {
      articleCover.addEventListener('load', function () { extractCoverPalette(articleCover); }, { once: true });
    }
  }

  var progressBar = document.querySelector('.reading-progress__bar');
  var lastY = window.scrollY || 0;
  var ticking = false;

  function updateOnScroll() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    var progress = maxScroll > 0 ? Math.min(1, Math.max(0, y / maxScroll)) : 0;
    if (progressBar) progressBar.style.transform = 'scaleX(' + progress + ')';
    if (y < 90 || y < lastY - 3) {
      body.classList.remove('header-hidden');
    } else if (y > lastY + 3 && y > 150) {
      body.classList.add('header-hidden');
    }
    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      window.requestAnimationFrame(updateOnScroll);
      ticking = true;
    }
  }, { passive: true });
  updateOnScroll();

  if (!reduceMotion && 'IntersectionObserver' in window) {
    var revealTargets = document.querySelectorAll('.article-header, .cover, .prose h2, .prose h3, .prose figure, .prose img');
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
    revealTargets.forEach(function (element) {
      element.classList.add('scroll-reveal');
      observer.observe(element);
    });
  }
})();
</script>
</body>
</html>
