<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body class="{% if page.layout == 'post' %}post-page{% elsif page.url == '/' %}home-page{% endif %}" data-theme-color="{{ page.theme_color | default: '' | escape }}">
<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}">FIELD NOTES<span>Ning's field observation</span></a>
  <nav aria-label="主导航">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/about/' | relative_url }}">我是谁</a>
  </nav>
</header>
{% if page.layout == 'post' %}
<div class="reading-progress" aria-hidden="true"><span class="reading-progress__bar"></span></div>
{% endif %}
<main class="site-main">{{ content }}</main>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} · FIELD NOTES</span><span>持续观察，持续书写。</span></footer>
<script>
(function () {
  var body = document.body;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Detect the actual page content instead of relying on a Liquid URL comparison. */
  var homeHero = document.querySelector('.home-hero-single');
  if (homeHero) {
    body.classList.add('home-page');
    var heroImage = homeHero.querySelector('.hero-single-image');
    var heroFeature = homeHero.querySelector('.hero-feature');

    /* Cinematic parallax: background and foreground move at different speeds. */
    if (heroImage && !reduceMotion) {
      var parallaxPending = false;
      function updateParallax() {
        var rect = homeHero.getBoundingClientRect();
        var imageShift = Math.max(-55, Math.min(155, -rect.top * 0.24));
        var textShift = Math.max(-12, Math.min(38, -rect.top * 0.055));
        heroImage.style.transform = 'translate3d(0,' + imageShift.toFixed(1) + 'px,0) scale(1.18)';
        if (heroFeature) heroFeature.style.transform = 'translate3d(0,' + textShift.toFixed(1) + 'px,0)';
        parallaxPending = false;
      }
      function requestParallax() {
        if (!parallaxPending) {
          window.requestAnimationFrame(updateParallax);
          parallaxPending = true;
        }
      }
      window.addEventListener('scroll', requestParallax, { passive: true });
      window.addEventListener('resize', requestParallax);
      updateParallax();
    }

    /* Each month is an independent, looping carousel with autoplay and manual controls. */
    document.querySelectorAll('[data-month-carousel]').forEach(function (carousel) {
      var track = carousel.querySelector('[data-carousel-track]');
      var section = carousel.closest('.month-block');
      var previous = section && section.querySelector('[data-carousel-prev]');
      var next = section && section.querySelector('[data-carousel-next]');
      var pagination = section && section.querySelector('[data-carousel-pagination]');
      if (!track || !section) return;

      var cards = Array.prototype.slice.call(track.querySelectorAll('.month-card'));
      if (cards.length < 2) {
        if (section.querySelector('.carousel-controls')) section.querySelector('.carousel-controls').hidden = true;
        return;
      }

      var current = 0;
      var timer = null;
      var inView = true;
      var paused = false;
      var resumeTimer = null;
      var dots = [];

      function cardLeft(index) {
        return track.scrollLeft + cards[index].getBoundingClientRect().left - track.getBoundingClientRect().left;
      }

      function nearestIndex() {
        var bestIndex = 0;
        var bestDistance = Infinity;
        cards.forEach(function (card, index) {
          var distance = Math.abs(card.getBoundingClientRect().left - track.getBoundingClientRect().left);
          if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = index;
          }
        });
        return bestIndex;
      }

      function paintState() {
        current = nearestIndex();
        if (dots.length) dots.forEach(function (dot, index) {
          var active = index === current;
          dot.classList.toggle('is-active', active);
          dot.setAttribute('aria-current', active ? 'true' : 'false');
        });
        if (previous) previous.disabled = false;
        if (next) next.disabled = false;
      }

      function goTo(index, smooth) {
        current = (index + cards.length) % cards.length;
        track.scrollTo({
          left: cardLeft(current),
          behavior: smooth && !reduceMotion ? 'smooth' : 'auto'
        });
        paintState();
      }

      if (pagination) {
        cards.forEach(function (_, index) {
          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'carousel-dot' + (index === 0 ? ' is-active' : '');
          dot.setAttribute('aria-label', '查看第 ' + (index + 1) + ' 篇文章');
          dot.setAttribute('aria-current', index === 0 ? 'true' : 'false');
          dot.addEventListener('click', function () {
            pauseForInteraction();
            goTo(index, true);
          });
          pagination.appendChild(dot);
          dots.push(dot);
        });
      }

      function stopAutoplay() {
        if (timer) window.clearInterval(timer);
        timer = null;
      }

      function startAutoplay() {
        if (timer || paused || !inView || document.hidden) return;
        timer = window.setInterval(function () {
          goTo(nearestIndex() + 1, true);
        }, 4600);
      }

      function pauseForInteraction() {
        paused = true;
        stopAutoplay();
        if (resumeTimer) window.clearTimeout(resumeTimer);
        resumeTimer = window.setTimeout(function () {
          paused = false;
          startAutoplay();
        }, 6500);
      }

      if (previous) previous.addEventListener('click', function () {
        pauseForInteraction();
        goTo(nearestIndex() - 1, true);
      });
      if (next) next.addEventListener('click', function () {
        pauseForInteraction();
        goTo(nearestIndex() + 1, true);
      });

      track.addEventListener('scroll', function () {
        window.requestAnimationFrame(paintState);
      }, { passive: true });
      track.addEventListener('touchstart', pauseForInteraction, { passive: true });
      track.addEventListener('pointerdown', pauseForInteraction, { passive: true });
      section.addEventListener('mouseenter', function () {
        paused = true;
        stopAutoplay();
      });
      section.addEventListener('mouseleave', function () {
        paused = false;
        startAutoplay();
      });
      section.addEventListener('focusin', function () {
        paused = true;
        stopAutoplay();
      });
      section.addEventListener('focusout', function () {
        window.setTimeout(function () {
          if (!section.contains(document.activeElement)) {
            paused = false;
            startAutoplay();
          }
        }, 80);
      });

      if ('IntersectionObserver' in window) {
        var visibilityObserver = new IntersectionObserver(function (entries) {
          inView = entries[0].isIntersecting;
          if (inView) startAutoplay();
          else stopAutoplay();
        }, { threshold: 0.2 });
        visibilityObserver.observe(section);
      }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopAutoplay();
        else startAutoplay();
      });

      paintState();
      startAutoplay();
    });
  }

  /* Article page: ensure the theme script runs whenever an article is present. */
  var articleRoot = document.querySelector('.article');
  if (articleRoot) {
    body.classList.add('post-page');

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        var d = max - min;
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
        else if (max === g) h = ((b - r) / d + 2) * 60;
        else h = ((r - g) / d + 4) * 60;
      }
      return { h: h, s: s, l: l };
    }

    function applyHue(hue, saturation) {
      var h = Math.round((hue + 360) % 360);
      var s = Math.max(25, Math.min(52, Math.round(saturation * 75)));
      var accentS = Math.max(38, Math.min(64, s + 12));
      body.style.setProperty('--article-bg', 'hsl(' + h + ' ' + s + '% 10%)');
      body.style.setProperty('--article-surface', 'hsl(' + h + ' ' + s + '% 15%)');
      body.style.setProperty('--article-line', 'hsl(' + h + ' ' + Math.min(30, s) + '% 29%)');
      body.style.setProperty('--article-accent', 'hsl(' + h + ' ' + accentS + '% 73%)');
      body.style.setProperty('--article-muted', 'hsl(' + h + ' 9% 70%)');
      body.style.setProperty('--article-glow', 'hsl(' + h + ' ' + Math.min(58, s + 8) + '% 25% / .42)');
    }

    function applyHex(hex) {
      var match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
      if (!match) return false;
      var value = match[1];
      var color = rgbToHsl(
        parseInt(value.slice(0, 2), 16),
        parseInt(value.slice(2, 4), 16),
        parseInt(value.slice(4, 6), 16)
      );
      applyHue(color.h, Math.max(color.s, 0.3));
      return true;
    }

    function extractCoverPalette(image) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 96;
        canvas.height = 96;
        var context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) throw new Error('Canvas is unavailable');
        context.drawImage(image, 0, 0, 96, 96);
        var pixels = context.getImageData(0, 0, 96, 96).data;
        var bins = [];
        for (var b = 0; b < 36; b++) bins.push({ weight: 0, hueX: 0, hueY: 0, saturation: 0, count: 0 });

        for (var i = 0; i < pixels.length; i += 16) {
          if (pixels[i + 3] < 150) continue;
          var c = rgbToHsl(pixels[i], pixels[i + 1], pixels[i + 2]);
          if (c.l < 0.08 || c.l > 0.94) continue;
          var weight = Math.max(0.08, c.s) * (1 - Math.abs(c.l - 0.5) * 0.55);
          var bucket = Math.min(35, Math.floor(c.h / 10));
          bins[bucket].weight += weight;
          bins[bucket].hueX += Math.cos(c.h * Math.PI / 180) * weight;
          bins[bucket].hueY += Math.sin(c.h * Math.PI / 180) * weight;
          bins[bucket].saturation += c.s * weight;
          bins[bucket].count++;
        }

        var dominant = bins.reduce(function (best, item) {
          return item.weight > best.weight ? item : best;
        }, { weight: 0, hueX: 0, hueY: 0, saturation: 0, count: 0 });

        if (!dominant.count || dominant.weight < 0.2) {
          applyHue(28, 0.28);
          return;
        }
        var hue = Math.atan2(dominant.hueY, dominant.hueX) * 180 / Math.PI;
        var saturation = dominant.saturation / dominant.weight;
        applyHue(hue, Math.max(saturation, 0.28));
      } catch (error) {
        /* The cover is still shown; retain a visible, warm dark fallback. */
        applyHue(28, 0.28);
      }
    }

    var manualTheme = body.getAttribute('data-theme-color');
    var cover = articleRoot.querySelector('.cover');
    if (!applyHex(manualTheme)) {
      if (cover && cover.complete && cover.naturalWidth > 0) extractCoverPalette(cover);
      else if (cover) {
        cover.addEventListener('load', function () { extractCoverPalette(cover); }, { once: true });
        cover.addEventListener('error', function () { applyHue(28, 0.28); }, { once: true });
      } else {
        applyHue(28, 0.28);
      }
    }

    var progressBar = document.querySelector('.reading-progress__bar');
    var lastY = window.scrollY || 0;
    var ticking = false;
    function updateOnScroll() {
      var y = window.scrollY || document.documentElement.scrollTop || 0;
      var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      var progress = maxScroll > 0 ? Math.min(1, Math.max(0, y / maxScroll)) : 0;
      if (progressBar) progressBar.style.transform = 'scaleX(' + progress + ')';
      if (y < 90 || y < lastY - 3) body.classList.remove('header-hidden');
      else if (y > lastY + 3 && y > 150) body.classList.add('header-hidden');
      lastY = y;
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(updateOnScroll);
        ticking = true;
      }
    }, { passive: true });
    updateOnScroll();

    if (!reduceMotion && 'IntersectionObserver' in window) {
      var revealTargets = document.querySelectorAll('.article-header, .cover, .prose h2, .prose h3, .prose figure, .prose img');
      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
      revealTargets.forEach(function (element) {
        element.classList.add('scroll-reveal');
        revealObserver.observe(element);
      });
    }
  }
})();
</script>
</body>
</html>
